name: Build and Deploy

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, feat/webapp-integration ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'

    # The data-ob scripts run on the ituob gem bundle (data-ob/ituob/Gemfile,
    # committed lockfile) — the repo-root Gemfile is the legacy Jekyll chain.
    - name: Generate TS wire types and runtime validators from the LML ontology
      working-directory: data-ob
      env:
        BUNDLE_GEMFILE: ituob/Gemfile
        SITE_TYPES_PATH: ${{ github.workspace }}/src/lib/schema.generated.ts
        SITE_VALIDATORS_PATH: ${{ github.workspace }}/src/lib/schema.validators.generated.ts
        CLASS_DESCRIPTION_PATH: ${{ github.workspace }}/src/lib/form/class-description.generated.json
      run: |
        bundle install
        bundle exec ruby scripts/generate_ts_types.rb
        bundle exec ruby scripts/generate_class_description.rb

    - name: Verify committed wire types, validators and form description match the ontology
      run: git diff --exit-code -- src/lib/schema.generated.ts src/lib/schema.validators.generated.ts src/lib/form/class-description.generated.json

    - name: Project pinned authored data and generate register snapshots
      run: |
        python3 scripts/project-authored-data.py \
          --data-root data --service-root data-ob \
          --data-ref "$(git -C data rev-parse HEAD)" \
          --service-ref "$(git -C data-ob rev-parse HEAD)" \
          --snapshots-out data/snapshots \
          --projection-root "$RUNNER_TEMP/ituob-site-projection"
        echo "OB_DATA_ROOT=$RUNNER_TEMP/ituob-site-projection" >> "$GITHUB_ENV"

    - name: Verify projection guards
      run: python3 -m unittest discover -s scripts/tests -p test_project_authored_data.py

    - name: Install dependencies
      run: npm ci

    - name: Verify generated register identities and country fields
      run: |
        node scripts/generate-register-rules.mjs data-ob/catalogs/registers.yaml
        git diff --exit-code -- src/lib/register-rules.generated.ts

    - name: Worker tests
      run: npx vitest run

    - name: Worker typecheck
      run: npm run typecheck:worker

    - name: Provider and deployment configuration tests
      run: npx vitest run --config vitest.providers.config.ts
    - name: Edition metadata SQL regression tests
      run: npx vitest run --config test/edition-metadata.config.ts
    - name: General-message SQL and validator regression tests
      run: npx vitest run --config test/general-messages.config.ts

    - name: Item history and textual action regression tests
      run: |
        node --experimental-strip-types --test test/item-history.node-test.ts
        node --experimental-transform-types --test test/textual-validation.node-test.ts
        node --test test/parity-render.node-test.mjs

    # Round-trips every form-driven file in data-ob through the form model.
    - name: Form round-trip tests
      run: npm run test:form

    - name: Build Astro site
      run: npm run build

    - name: Run TypeScript check
      run: npm run check

    - name: Retain exact issue and dataset projection for parity audit
      uses: actions/upload-artifact@v4
      with:
        name: authored-projection
        path: |
          ${{ runner.temp }}/ituob-site-projection/ob-issues
          ${{ runner.temp }}/ituob-site-projection/datasets
        if-no-files-found: error

    - name: Upload dist for Cloudflare deploys
      uses: actions/upload-artifact@v4
      with:
        name: site-dist
        path: dist
        retention-days: 3

  # Cloudflare staging (ituob-org-staging.<account>.workers.dev, later
  # staging-www.ituob.org). Gated on the repo variable — flip it on
  # once CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are set.
  deploy-cloudflare-staging:
    needs: build
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: actions/download-artifact@v4
      with:
        name: site-dist
        path: dist
    - name: Verify staging bindings and authentication configuration
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      run: node scripts/configure-cloudflare.mjs --check --environment staging
    - name: Deploy to Cloudflare Workers (staging)
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        wranglerVersion: '4'
        command: deploy -c wrangler.staging.jsonc

  # Cloudflare production (www.ituob.org) — the DNS cutover target.
  # Same gate; see docs/cloudflare-webapp.adoc for the flip procedure.
  # Production flips ONLY when the owner sets CLOUDFLARE_DEPLOY_PRODUCTION=true.
  # Staging deploys unconditionally on pushes to the staging branch.
  deploy-cloudflare-production:
    needs: build
    if: vars.CLOUDFLARE_DEPLOY_PRODUCTION == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: actions/download-artifact@v4
      with:
        name: site-dist
        path: dist
    - name: Verify production bindings and authentication configuration
      env:
        CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      run: node scripts/configure-cloudflare.mjs --check --environment production
    - name: Deploy to Cloudflare Workers (production)
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        wranglerVersion: '4'
        command: deploy


  content-parity-audit:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'
    - name: Read the exact projection validated by the build
      uses: actions/download-artifact@v4
      with:
        name: authored-projection
        path: ${{ runner.temp }}/ituob-site-projection
    - name: Run per-issue audit
      working-directory: data-ob
      env:
        BUNDLE_GEMFILE: ituob/Gemfile
        ITU_OB_DATA_ROOT: ${{ github.workspace }}/data/issues
        OB_ISSUES_OUT_PATH: ${{ runner.temp }}/ituob-site-projection/ob-issues
        DATASETS_ROOT: ${{ runner.temp }}/ituob-site-projection/datasets
      run: |
        bundle install
        bundle exec ruby scripts/audit_per_issue.rb
    - name: Run cross-reference validation
      working-directory: data-ob
      env:
        BUNDLE_GEMFILE: ituob/Gemfile
        ITU_OB_DATA_ROOT: ${{ github.workspace }}/data/issues
        OB_ISSUES_OUT_PATH: ${{ runner.temp }}/ituob-site-projection/ob-issues
        DATASETS_ROOT: ${{ runner.temp }}/ituob-site-projection/datasets
      run: |
        bundle install
        bundle exec ruby scripts/validate_references.rb
