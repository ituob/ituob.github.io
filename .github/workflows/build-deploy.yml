name: Build and Deploy

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'

    # The data-ob scripts run on the ituob gem bundle (data-ob/ituob/Gemfile,
    # committed lockfile) — the repo-root Gemfile is the legacy Jekyll chain.
    - name: Generate TS wire types from the LML ontology
      working-directory: data-ob
      env:
        BUNDLE_GEMFILE: ituob/Gemfile
        SITE_TYPES_PATH: ${{ github.workspace }}/src/lib/schema.generated.ts
      run: bundle install && bundle exec ruby scripts/generate_ts_types.rb

    - name: Generate register snapshots
      working-directory: data-ob
      env:
        BUNDLE_GEMFILE: ituob/Gemfile
        SNAPSHOTS_OUT: ${{ github.workspace }}/data/snapshots
      run: bundle exec ruby scripts/generate_register_snapshots.rb

    - name: Install dependencies
      run: npm ci

    - name: Build Astro site
      run: npm run build

    - name: Run TypeScript check
      run: npm run check

    - name: Upload dist for Cloudflare deploys
      uses: actions/upload-artifact@v4
      with:
        name: site-dist
        path: dist
        retention-days: 3

  # Cloudflare staging (ituob-org-staging.<account>.workers.dev, later
  # staging-www.ituob.org). Gated on the repo variable — flip it on
  # once CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are set.
  deploy-cloudflare-staging:
    needs: build
    if: vars.CLOUDFLARE_DEPLOY == 'true' && github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: site-dist
        path: dist
    - name: Deploy to Cloudflare Workers (staging)
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        wranglerVersion: '4'
        command: deploy -c wrangler.staging.jsonc

  # Cloudflare production (www.ituob.org) — the DNS cutover target.
  # Same gate; see docs/cloudflare-webapp.adoc for the flip procedure.
  deploy-cloudflare-production:
    needs: build
    if: vars.CLOUDFLARE_DEPLOY == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: site-dist
        path: dist
    - name: Deploy to Cloudflare Workers (production)
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        wranglerVersion: '4'
        command: deploy


  content-parity-audit:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4'
    - name: Run per-issue audit
      working-directory: data-ob
      env:
        BUNDLE_GEMFILE: ituob/Gemfile
      run: |
        bundle install
        bundle exec ruby scripts/audit_per_issue.rb
    - name: Run cross-reference validation
      working-directory: data-ob
      env:
        BUNDLE_GEMFILE: ituob/Gemfile
      run: |
        bundle install
        bundle exec ruby scripts/validate_references.rb
